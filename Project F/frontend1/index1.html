<!DOCTYPE html>
<html>
<head>
    <title>Interest Difference Calculator</title>
</head>
<body>
    <h2>CI − SI Calculator</h2>
    <form>
        <label for="principal">Enter Principal Amount (P):</label><br>
        <input type="number" id="principal" name="principal"><br><br>

        <p>Rate of Interest (R): 10%</p>
        <p>Time (T): 3 years</p>

        <p><b>Formulas:</b></p>
        <p>Simple Interest (SI) = P × R × T / 100</p>
        <p>Compound Interest (CI) = P × (1 + R/100)^T − P</p>
        <p>Difference = CI − SI</p>
    </form>
</body>
</html>
